<!doctype html>
<html lang="fr">
  <body
    style="
      margin: 0;
      background: #f7fafc;
      color: #172033;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <div style="max-width: 600px; margin: 0 auto; padding: 32px 18px">
      <div
        style="
          background: #ffffff;
          border: 1px solid #dbe5f0;
          border-radius: 24px;
          overflow: hidden;
        "
      >
        <div style="padding: 28px 32px; background: #122b52; color: #ffffff">
          <div style="font-size: 20px; font-weight: 700; letter-spacing: 1px">MAILMIND</div>
          <div style="margin-top: 8px; color: #bfe7ef; font-size: 13px">
            L’intelligence au service de votre boîte mail.
          </div>
        </div>
        <div style="padding: 32px">
          <p style="margin: 0; color: #52627a; font-size: 13px">Invitation MailMind</p>
          <h1 style="margin: 10px 0 16px; font-size: 28px; line-height: 1.2; color: #122b52">
            Vous êtes invité à rejoindre MailMind
          </h1>
          <p style="margin: 0; color: #52627a; font-size: 15px; line-height: 1.7">
            Créez votre accès pour bénéficier de résumés, d’alertes et d’une boîte de réception plus
            claire.
          </p>
          <p style="margin: 28px 0">
            <a
              href="{{ .ConfirmationURL }}"
              style="
                display: inline-block;
                background: #2563eb;
                color: #ffffff;
                border-radius: 10px;
                padding: 14px 22px;
                text-decoration: none;
                font-weight: 700;
                font-size: 14px;
              "
            >
              Accepter l’invitation
            </a>
          </p>
        </div>
      </div>
      <p style="margin: 18px 0 0; text-align: center; color: #8491a3; font-size: 11px">
        © MailMind
      </p>
    </div>
  </body>
</html>
